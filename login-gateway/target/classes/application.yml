server:
  port: 8080

spring:
  application:
    name: login-gateway

  # Redis（用于 token 黑名单检查）
  data:
    redis:
      host: localhost
      port: 6379
      password:
      database: 0
      timeout: 3000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 0
          max-wait: 1000ms

  # Nacos 服务发现
  cloud:
    nacos:
      discovery:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP

    # Gateway 路由配置
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 认证服务
        - id: login-auth
          uri: lb://login-auth
          predicates:
            - Path=/auth/**

        # 用户服务
        - id: login-user
          uri: lb://login-user
          predicates:
            - Path=/user/**

      # 全局 CORS 配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods: "*"
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

# 日志
logging:
  level:
    com.login: debug
    org.springframework.cloud.gateway: info

jwt:
  secret: your-secret-key
  # 白名单配置
  whitelist:
    paths:
      - /auth/login
      - /auth/register
      - /auth/refresh
      - /actuator/health
      - /swagger-ui/**
      - /v3/api-docs/**
    enabled: true