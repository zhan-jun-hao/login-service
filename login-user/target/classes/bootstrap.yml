# ==========================================
# Nacos 配置中心 Bootstrap 配置 — login-user
# ==========================================

spring:
  application:
    name: login-user

  cloud:
    nacos:
      config:
        server-addr: localhost:8848
        namespace: public
        group: DEFAULT_GROUP
        file-extension: yaml
        shared-configs:
          - data-id: shared-redis.yaml
            group: DEFAULT_GROUP
            refresh: true
        refresh-enabled: true
        enabled: true

logging:
  level:
    com.alibaba.nacos.client.config: warn
